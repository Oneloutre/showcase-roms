<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NO ETA Will be provided!</title>
    <link rel="stylesheet" href="style.css">
    <meta property="og:title" content="Onelot's personal EvoX mirror - ETA page">
    <meta property="og:description" content="Know when your device will be released!">
    <meta property="og:url" content="https://evox.onelots.fr/eta">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://github.com/oneloutre.png">
    <meta property="og:image:width" content="460">
    <meta property="og:image:height" content="460">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            background: radial-gradient(circle, #9c27b0, #e91e63, #f44336);
            font-family: 'Inter', sans-serif;
        }

        .eta-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-eta {
            font-size: 5rem;
            font-weight: bold;
            color: white;
            text-align: center;
            animation: pulse 2s infinite ease-in-out;
            z-index: 10;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .floating-eta {
            position: absolute;
            font-weight: bold;
            color: white;
            white-space: nowrap;
            animation-duration: var(--duration);
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-name: float;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes float {
            0% { transform: translate(var(--startX), var(--startY)) rotate(var(--startRotate)); }
            33% { transform: translate(var(--midX), var(--midY)) rotate(var(--midRotate)); }
            66% { transform: translate(var(--endX), var(--endY)) rotate(var(--endRotate)); }
            100% { transform: translate(var(--startX), var(--startY)) rotate(var(--startRotate)); }
        }
    </style>
</head>
<body>
    <div class="eta-container">
        <div class="main-eta">NO ETA</div>
    </div>

    <script>
        // Create floating "NO ETA" elements
        const container = document.querySelector('.eta-container');
        const numElements = 20;

        for (let i = 0; i < numElements; i++) {
            const element = document.createElement('div');
            element.className = 'floating-eta';
            element.textContent = 'NO ETA';
            
            // Random size
            const size = 1 + Math.random() * 3;
            element.style.fontSize = `${size}rem`;
            
            // Random position variables
            const startX = `${Math.random() * 100}vw`;
            const startY = `${Math.random() * 100}vh`;
            const midX = `${Math.random() * 100}vw`;
            const midY = `${Math.random() * 100}vh`;
            const endX = `${Math.random() * 100}vw`;
            const endY = `${Math.random() * 100}vh`;
            
            // Random rotation
            const startRotate = `${Math.random() * 360}deg`;
            const midRotate = `${Math.random() * 360}deg`;
            const endRotate = `${Math.random() * 360}deg`;
            
            // Random duration
            const duration = 10 + Math.random() * 20;
            
            // Random color
            const hue = Math.random() * 360;
            element.style.color = `hsl(${hue}, 100%, 90%)`;
            
            // Set CSS variables for the animation
            element.style.setProperty('--startX', startX);
            element.style.setProperty('--startY', startY);
            element.style.setProperty('--midX', midX);
            element.style.setProperty('--midY', midY);
            element.style.setProperty('--endX', endX);
            element.style.setProperty('--endY', endY);
            element.style.setProperty('--startRotate', startRotate);
            element.style.setProperty('--midRotate', midRotate);
            element.style.setProperty('--endRotate', endRotate);
            element.style.setProperty('--duration', `${duration}s`);
            
            container.appendChild(element);
        }
    </script>
</body>
</html>
